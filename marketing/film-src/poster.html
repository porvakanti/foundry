<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Figtree;src:url(fonts/Figtree-500.ttf);font-weight:500}
@font-face{font-family:Figtree;src:url(fonts/Figtree-800.ttf);font-weight:800}
html,body{margin:0;width:1280px;height:720px;overflow:hidden}
body{background:radial-gradient(ellipse 900px 560px at 50% 42%,#3a0a0a 0%,#140707 45%,#08080a 100%);font-family:Figtree,sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mark{position:relative;width:150px;height:150px;margin-bottom:26px}
.mark img{position:absolute;left:25px;top:25px;width:100px;height:100px}
.mark svg{position:absolute;inset:0}
h1{font-weight:800;font-size:112px;letter-spacing:-.035em;margin:0;line-height:1}
p{font-weight:500;font-size:34px;margin:26px 0 0;color:rgba(255,255,255,.82)}
.bar{width:90px;height:6px;border-radius:3px;background:#E60000;margin-top:30px}
</style></head><body>
<div class="mark"><svg width="150" height="150"><circle cx="75" cy="75" r="66" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/><circle cx="75" cy="9" r="7" fill="#E60000"/><circle cx="132" cy="108" r="7" fill="#9C2AA0"/><circle cx="18" cy="108" r="7" fill="#00B0CA"/></svg><img src="../../design/assets/vf_logo.png"></div>
<h1>Agent Marketplace</h1><p>Built by our people, for our people.</p><div class="bar"></div>
</body></html>
