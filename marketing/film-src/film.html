<!doctype html>
<html><head><meta charset="utf-8"><title>Agent Marketplace — Film</title>
<style>
@font-face{font-family:Figtree;src:url(fonts/Figtree-400.ttf);font-weight:400}
@font-face{font-family:Figtree;src:url(fonts/Figtree-500.ttf);font-weight:500}
@font-face{font-family:Figtree;src:url(fonts/Figtree-600.ttf);font-weight:600}
@font-face{font-family:Figtree;src:url(fonts/Figtree-700.ttf);font-weight:700}
@font-face{font-family:Figtree;src:url(fonts/Figtree-800.ttf);font-weight:800}
@font-face{font-family:Figtree;src:url(fonts/Figtree-900.ttf);font-weight:900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Figtree,system-ui,sans-serif;color:#1A1A1A;-webkit-font-smoothing:antialiased}
canvas{position:absolute;left:0;top:0}
.scene{position:absolute;inset:0;display:none}
.abs{position:absolute;left:0;top:0}
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding:.08em .05em .16em;margin:-.08em -.05em -.16em}
.w,.ch{display:inline-block;will-change:transform}
.kicker{font-weight:700;font-size:22px;letter-spacing:.32em;text-transform:uppercase;color:#E60000;white-space:nowrap}
.h1{font-weight:800;letter-spacing:-.035em;line-height:1.0;white-space:nowrap}
.card{background:#fff;border:1px solid #E2DFD9;border-radius:24px;box-shadow:0 30px 60px -20px rgba(40,20,10,.18),0 8px 18px -8px rgba(40,20,10,.10)}
.av{display:flex;align-items:center;justify-content:center;border-radius:16px;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;font-weight:700;white-space:nowrap}
.grad{background:linear-gradient(90deg,#E60000 0%,#9C2AA0 50%,#00B0CA 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
#grain{mix-blend-mode:overlay}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style></head>
<body><div id="stage">
<canvas id="bg" width="1920" height="1080"></canvas>
<canvas id="pc" width="1920" height="1080"></canvas>
</div>
<script src="build/cues.js"></script>
<script>
// =====================================================================
//  Agent Marketplace — 120s motion film. Deterministic: seek(t) renders t.
// =====================================================================
const W=1920,H=1080,CX=960,CY=540;
const RED='#E60000',DRED='#820000',PUR='#9C2AA0',TEAL='#007C92',TURQ='#00B0CA',ORA='#EB9700',LEM='#A8B400',CREAM='#FAF9F7',INK='#1A1A1A',BORDER='#E2DFD9';
const stage=document.getElementById('stage');
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const E={
 lin:x=>x, inQ:x=>x*x, inC:x=>x*x*x, outC:x=>1-Math.pow(1-x,3), outQ:x=>1-Math.pow(1-x,5),
 ioC:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, ioQ:x=>x<.5?16*x*x*x*x*x:1-Math.pow(-2*x+2,5)/2,
 outX:x=>x>=1?1:1-Math.pow(2,-10*x), inX:x=>x<=0?0:Math.pow(2,10*x-10),
 ioX:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
 outB:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
 outB2:x=>{const c1=2.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
 outEl:x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*Math.PI)/3)+1,
};
const cl=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const P=(t,a,b)=>cl((t-a)/(b-a));
const tw=(t,a,b,e=E.outX)=>e(P(t,a,b));
const L=(a,b,k)=>a+(b-a)*k;
function h(tag,cls,parent,html,style){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style){Object.assign(e.style,style);if(style.right!=null&&style.left==null)e.style.left='auto';if(style.bottom!=null&&style.top==null)e.style.top='auto';}(parent||stage).appendChild(e);return e}
function S(e,o){for(const k in o)e.style[k]=o[k]}
function T(e,x,y,s=1,r=0,extra=''){e.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg) ${extra}`}
function words(el,text){el.innerHTML='';const parts=text.split(' ');return parts.map((w,i)=>{const m=h('span','wm',el);const s=h('span','w',m,w);if(i<parts.length-1)el.appendChild(document.createTextNode(' '));return s})}
function chars(el,text){el.innerHTML='';return [...text].map(c=>h('span','ch',el,c===' '?'&nbsp;':c))}
// mask word reveal: k 0..1 in, then optional out
function wIn(w,t,t0,d=.7,e=E.outX){const k=tw(t,t0,t0+d,e);w.style.transform=`translateY(${(1-k)*118}%)`;return k}
function wInOut(w,t,t0,t1,d=.7,d2=.5){const ki=tw(t,t0,t0+d,E.outX),ko=tw(t,t1,t1+d2,E.inC);w.style.transform=`translateY(${(1-ki)*118-ko*118}%)`}
function op(e,v){e.style.opacity=v}
function vis(e,v){e.style.display=v?'':'none'}
const R0=mulberry(11);
const ICON={
 search:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>`,
 lock:`<svg viewBox="0 0 64 64" width="100%" height="100%"><path class="shackle" d="M20 30V20a12 12 0 0 1 24 0v10" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><rect x="12" y="28" width="40" height="30" rx="7" fill="currentColor"/><circle cx="32" cy="42" r="4.5" fill="#fff"/><rect x="30" y="43" width="4" height="8" rx="2" fill="#fff"/></svg>`,
 plus:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
 diamond:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><path d="M12 3l9 9-9 9-9-9z"/></svg>`,
 arrow:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>`,
 spark:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg>`,
 check:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path class="ck" d="M5 12.5l4.5 4.5L19 7.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>`,
 cursor:`<svg viewBox="0 0 32 32" width="44" height="44"><path d="M6 3l20 12.5-9 1.8-4.6 8.6z" fill="#1A1A1A" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>`,
 mail:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>`,
};
const AG={
 'Sourcing Copilot':{i:'SC',p:'Emplay',m:'Scaled',f:'Sourcing',c:ORA},
 'Contract IQ':{i:'CI',p:'GCP',m:'Scaled',f:'Contracts',c:TURQ},
 'Spend Lens':{i:'SL',p:'Looker',m:'Scaled',f:'Analytics',c:LEM},
 'PO Chaser':{i:'PC',p:'Copilot',m:'Pilot',f:'P2P',c:PUR},
 'Negotiation Prep':{i:'NP',p:'Copilot',m:'Pilot',f:'Sourcing',c:PUR},
 'Onboarding Buddy':{i:'OB',p:'Copilot',m:'Pilot',f:'Supplier Mgmt',c:PUR},
 'Savings Tracker':{i:'ST',p:'Copilot',m:'Pilot',f:'Analytics',c:PUR},
 'Minute Maker':{i:'MM',p:'Copilot',m:'Pilot',f:'Governance',c:PUR},
 'Tail-Spend Triage':{i:'TS',p:'Copilot',m:'Idea',f:'P2P',c:PUR},
 'ESG Compliance Scout':{i:'EC',p:'GCP',m:'Idea',f:'Supplier Mgmt',c:TURQ},
 'Invoice Dispute Resolver':{i:'ID',p:'Copilot',m:'Idea',f:'P2P',c:PUR},
};
function tint(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}

// ---------------- canvases ----------------
const bg=document.getElementById('bg').getContext('2d');
const pcv=document.getElementById('pc'),pc=pcv.getContext('2d');
const scenes=[];
function scene(a,b,build,render){const el=h('div','scene');const s={a,b,el,render};build(s,el);scenes.push(s);return s}

// ---------- background painters ----------
function paintDark(t){
 bg.fillStyle='#09090A';bg.fillRect(0,0,W,H);
 const blobs=[[RED,.20,960+Math.sin(t*.21)*380,480+Math.cos(t*.17)*160,820],[DRED,.30,300+Math.cos(t*.13)*200,900,700],[PUR,.10,1600+Math.sin(t*.1)*120,200,700]];
 for(const [c,a,x,y,r] of blobs){const g=bg.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,tint(c,a));g.addColorStop(1,tint(c,0));bg.fillStyle=g;bg.fillRect(0,0,W,H)}
}
function paintLight(t){
 bg.fillStyle=CREAM;bg.fillRect(0,0,W,H);
 const blobs=[[RED,.075,300+Math.sin(t*.15)*160,250+Math.cos(t*.12)*90,760],[PUR,.07,1650+Math.cos(t*.11)*140,300+Math.sin(t*.14)*120,760],[TURQ,.085,1200+Math.sin(t*.09)*260,980,820],[ORA,.04,500,1000,600]];
 for(const [c,a,x,y,r] of blobs){const g=bg.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,tint(c,a));g.addColorStop(1,tint(c,0));bg.fillStyle=g;bg.fillRect(0,0,W,H)}
}
function paintRed(t){
 const g=bg.createRadialGradient(960,470,0,960,540,1250);g.addColorStop(0,'#FF2A1F');g.addColorStop(.45,'#E60000');g.addColorStop(1,'#6E0000');bg.fillStyle=g;bg.fillRect(0,0,W,H);
 const g2=bg.createRadialGradient(960+Math.sin(t*.3)*300,300,0,960,300,700);g2.addColorStop(0,'rgba(255,190,150,.16)');g2.addColorStop(1,'rgba(255,190,150,0)');bg.fillStyle=g2;bg.fillRect(0,0,W,H);
}
function circ(x,y,r,fill){bg.save();bg.beginPath();bg.arc(x,y,Math.max(0,r),0,7);bg.clip();fill();bg.restore()}
function band(top,fill){bg.save();bg.beginPath();bg.rect(0,top,W,H-top+5);bg.clip();fill();bg.restore()}
// orbit mark component (roundel + ring + 3 dots)
function orbitMark(parent,size,dotCols,ringCol){
 const m=h('div','abs',parent,null,{width:size*1.5+'px',height:size*1.5+'px'});
 const R=size*.66;const c=size*.75;
 m.innerHTML=`<svg class="abs" width="${size*1.5}" height="${size*1.5}" style="overflow:visible"><circle class="ring" cx="${c}" cy="${c}" r="${R}" fill="none" stroke="${ringCol}" stroke-width="${Math.max(1.5,size*.012)}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-90 ${c} ${c})"/></svg>`;
 const glow=h('div','abs',m,null,{width:size*1.5+'px',height:size*1.5+'px',borderRadius:'50%',background:'radial-gradient(circle,rgba(230,0,0,.45) 0%,rgba(230,0,0,0) 60%)'});
 const img=h('img','abs',m,null,{width:size+'px',height:size+'px',left:size*.25+'px',top:size*.25+'px'});img.src='../../design/assets/vf_logo.png';
 const dots=dotCols.map((c,i)=>h('div','abs',m,null,{width:size*.11+'px',height:size*.11+'px',borderRadius:'50%',background:c,boxShadow:`0 0 ${size*.08}px ${c}`}));
 return {m,img,dots,glow,ring:m.querySelector('.ring'),R,c,size};
}
function renderMark(o,t,kImg,kRing,kDots,spin=0){
 o.img.style.transform=`scale(${kImg}) rotate(${(1-kImg)*-140}deg)`;
 o.ring.style.strokeDashoffset=1-kRing;
 o.dots.forEach((d,i)=>{const a=spin+i*2.0944,ds=o.size*.11;const x=o.c+o.R*Math.cos(a)-ds/2,y=o.c+o.R*Math.sin(a)-ds/2;d.style.transform=`translate(${x}px,${y}px) scale(${cl(kDots*3-i*.9,0,1)})`});
}
const parts=[];{const R=mulberry(7);for(let i=0;i<1500;i++){parts.push({sx:R()*W*1.5-W*.25,sy:R()*H*1.5-H*.25,a:.35+R()*.6,sz:.9+R()*2.3,wh:R()<.2})}}
// ---------- cue helpers (all timing comes from build/cues.js) ----------
const CL=window.CUES.lines;
const ORDER=Object.keys(CL);
const nz=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
const ls=id=>CL[id].t, le=id=>CL[id].end;
// time of the n-th occurrence of a word (prefix match) in a line
function at(id,word,n=0){const ws=CL[id].text.split(' ');let c=0;for(let i=0;i<ws.length;i++){if(nz(ws[i]).startsWith(nz(word))){if(c===n)return CL[id].words[i];c++}}throw new Error('cue '+id+':'+word)}
// scene start = a beat before its line; scene end = next scene start + overlap
function S0(id){const i=ORDER.indexOf(id);if(i<=0)return 0;const gap=ls(id)-le(ORDER[i-1]);return ls(id)-Math.min(1.0,gap*.55)}
function S1(id){const i=ORDER.indexOf(id);return i===ORDER.length-1?120.01:S0(ORDER[i+1])+.7}
const MAXR=1150;
const T_LIGHT=S0('intro'),T_DARK=S0('cycle'),T_RED=S0('outro');
function drawBG(t){
 if(t<T_LIGHT-.15){paintDark(t);return}
 if(t<T_LIGHT+1.4){paintDark(t);const a=T_LIGHT-.15;
  const fl=tw(t,a-.2,a,E.outC)*(1-tw(t,a,a+.45,E.inC));
  circ(CX,CY,tw(t,a,a+.75,E.ioX)*MAXR,()=>paintRed(t));
  circ(CX,CY,tw(t,a+.38,a+1.25,E.ioX)*MAXR,()=>paintLight(t));
  if(fl>0){const g=bg.createRadialGradient(CX,CY,0,CX,CY,260);g.addColorStop(0,`rgba(255,240,235,${fl})`);g.addColorStop(.25,`rgba(255,60,40,${fl*.8})`);g.addColorStop(1,'rgba(230,0,0,0)');bg.fillStyle=g;bg.fillRect(0,0,W,H)}
  return}
 const d=T_DARK-.35;
 if(t<d){paintLight(t);return}
 if(t<d+1.2){paintLight(t);const k1=tw(t,d,d+.8,E.ioX),k2=tw(t,d+.15,d+1.0,E.ioX);band(H-(H+60)*k1,()=>paintRed(t));band(H-(H+60)*k2,()=>paintDark(t));return}
 if(t<T_RED-.3){paintDark(t);return}
 paintDark(t);circ(CX,CY,tw(t,T_RED-.3,T_RED+.6,E.ioX)*MAXR,()=>paintRed(t));
}
function darkness(t){if(t<T_LIGHT)return 1;if(t<T_LIGHT+1)return 1-P(t,T_LIGHT,T_LIGHT+1);if(t<T_DARK-.3)return 0;if(t<T_RED)return P(t,T_DARK-.3,T_DARK+.5);return 1-.4*P(t,T_RED-.3,T_RED+.5)}

const GLYPH={
 bars:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><rect x="4" y="12" width="4" height="8" rx="1.2"/><rect x="10" y="7" width="4" height="13" rx="1.2"/><rect x="16" y="3" width="4" height="17" rx="1.2"/></svg>`,
 doc:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M9 12h6M9 16h6"/></svg>`,
 chat:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><path d="M4 5h16v11H9l-5 4z"/></svg>`,
 shield:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z"/></svg>`,
 bolt:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>`,
 bulb:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>`,
 people:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><circle cx="8" cy="8" r="3.5"/><circle cx="16.5" cy="9" r="3"/><path d="M1.5 20c.5-4 3.3-6 6.5-6s6 2 6.5 6z"/><path d="M14.5 14.6c.6-.2 1.3-.3 2-.3 2.8 0 5 1.7 5.5 5.7h-6"/></svg>`,
 person:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.7-4.6 4-7 8.5-7s7.8 2.4 8.5 7z"/></svg>`,
 star:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>`,
 trophy:`<svg viewBox="0 0 64 64" width="100%" height="100%"><path d="M18 8h28v14c0 9-6 16-14 16s-14-7-14-16z" fill="currentColor"/><path d="M18 13H9v4c0 6 4 10 10 10M46 13h9v4c0 6-4 10-10 10" fill="none" stroke="currentColor" stroke-width="4"/><rect x="28" y="38" width="8" height="10" fill="currentColor"/><rect x="18" y="48" width="28" height="8" rx="2" fill="currentColor"/></svg>`,
 cycle:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>`,
};
const FN=['Sourcing','Contracts','P2P','Supplier Mgmt','Analytics','Governance'];
function stars5(parent,size,col){const r=h('div','',parent,null,{display:'flex',gap:Math.round(size*.18)+'px'});return [...Array(5)].map(()=>{const s=h('div','',r,GLYPH.star,{width:size+'px',height:size+'px',color:'#E4E0DA'});s.dataset.col=col;return s})}
function fillStars(st,k,col){st.forEach((s,i)=>{const kk=cl(k*5-i);s.style.color=kk>.5?col:'#E4E0DA';s.style.transform=`scale(${1+.35*Math.sin(Math.PI*kk)})`})}
function chapter(el,num,label,x,y,align='left'){const k=h('div','abs kicker',el,null,{left:x+'px',top:y+'px',width:align==='center'?'1920px':'',textAlign:align});return words(k,`${num} · ${label}`)}
function headline(el,text,x,y,size,align='left',col=INK){const e=h('div','abs h1',el,null,{left:x+'px',top:y+'px',fontSize:size+'px',color:col,width:align==='center'?'1920px':'',textAlign:align});return {e,w:words(e,text)}}
function cursor(el){return h('div','abs',el,ICON.cursor,{zIndex:20})}
function ripple(el,col=RED){return h('div','abs',el,null,{width:'40px',height:'40px',borderRadius:'50%',border:`3px solid ${col}`,zIndex:19})}
function ripAt(r,x,y,t,t0){const p=P(t,t0,t0+.6);S(r,{transform:`translate(${x-20}px,${y-20}px) scale(${1+p*4})`,opacity:p>0&&p<1?1-p:0})}
function exitAll(list,t,t0,dy=-80){list.forEach((e,i)=>{const k=E.inC(P(t,t0+i*.03,t0+.5+i*.03));e.style.translate=`0 ${k*dy}px`;e.style.opacity=1-k})}

// ================= 1 · IMAGINE (dark) =================
scene(0,S1('imagine'),(s,el)=>{
 s.grid=h('div','abs',el,null,{left:'0',top:'0',width:'1920px',height:'1080px',perspective:'1400px'});
 const cols=9,rows=5,sz=150,gap=34,ox=960-(cols*sz+(cols-1)*gap)/2,oy=540-(rows*sz+(rows-1)*gap)/2;
 const icons=[GLYPH.bars,GLYPH.doc,GLYPH.chat,GLYPH.shield,GLYPH.bolt,ICON.spark,ICON.search,GLYPH.bulb,ICON.mail];
 const pals=[RED,PUR,TEAL,TURQ,ORA,LEM,DRED];const R=mulberry(5);
 const ini=['AN','TW','LF','MK','SR','JP','EH','DB','CO','RV','NK','YL','PB','GS','AM','FT','HO','KJ','LU','MD'];
 s.tiles=[];
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const col=pals[Math.floor(R()*pals.length)];
  const t=h('div','abs',s.grid,null,{left:(ox+c*(sz+gap))+'px',top:(oy+r*(sz+gap))+'px',width:sz+'px',height:sz+'px',transformStyle:'preserve-3d'});
